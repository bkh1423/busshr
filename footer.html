<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تذييل - متجر الورود</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#059669; --accent:#E11D48; --bg-soft:#FFFBF7; --text:#1F2937; --pink-soft:#FCE7F3; --radius:18px;
  }
  body{margin:0; font-family:"Tajawal", system-ui;}
  footer{background:#fff; border-top:1px solid #eee;}
  .wrap{max-width:1200px; margin:auto; padding:2rem 1rem; display:grid; gap:1.4rem; grid-template-columns:repeat(4,1fr)}
  .brand{grid-column:span 2}
  h4{margin:.2rem 0 .8rem; font-size:1.05rem}
  a{color:var(--text); text-decoration:none}
  a:hover{text-decoration:underline}
  .newsletter{
    background:var(--bg-soft); padding:1rem; border-radius:var(--radius);
    display:flex; gap:.6rem; align-items:center;
  }
  .newsletter input{
    flex:1; border:1px solid #ddd; border-radius:12px; padding:.6rem .8rem; font-family:inherit;
  }
  .newsletter button{
    border:none; background:var(--brand); color:#fff; border-radius:12px; padding:.6rem 1rem; font-weight:600; cursor:pointer;
  }
  .copy{border-top:1px solid #eee; padding:1rem; text-align:center; font-size:.9rem; color:#555}
  @media(max-width:820px){ .wrap{grid-template-columns:1fr 1fr} .brand{grid-column:span 2} }
</style>
</head>
<body>
<footer role="contentinfo" aria-label="تذييل الموقع">
  <div class="wrap">
    <div class="brand">
      <h3 style="margin:.2rem 0">متجر الورود</h3>
      <p>أجمل باقات الورود بتغليف فاخر وتوصيل سريع داخل السعودية.</p>
      <div class="newsletter" aria-label="نشرة بريدية">
        <input type="email" id="nlEmail" placeholder="بريدك الإلكتروني" inputmode="email" autocomplete="email" aria-label="أدخل بريدك">
        <button id="nlBtn">اشتراك</button>
      </div>
      <small id="nlMsg" role="status" aria-live="polite"></small>
    </div>
    <div>
      <h4>روابط</h4>
      <a href="#collections">التصنيفات</a><br>
      <a href="#bestsellers">الأكثر مبيعًا</a><br>
      <a href="#why-us">لماذا نحن</a>
    </div>
    <div>
      <h4>الدعم</h4>
      <a href="#faq">الأسئلة الشائعة</a><br>
      <a href="#contact">تواصل معنا</a>
    </div>
    <div>
      <h4>التواصل السريع</h4>
      <a href="https://wa.me/966500000000" rel="noopener" target="_blank">واتساب</a><br>
      <a href="mailto:sales@flowers.store">البريد الإلكتروني</a>
    </div>
  </div>
  <div class="copy">© <span id="year"></span> متجر الورود. جميع الحقوق محفوظة.</div>
</footer>

<script>
/* التحقق البسيط + إدارة أخطاء للمشتركين في النشرة */
(function(){
  const emailI = document.getElementById('nlEmail');
  const btn = document.getElementById('nlBtn');
  const msg = document.getElementById('nlMsg');
  const yr = document.getElementById('year');
  yr.textContent = new Date().getFullYear();

  function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

  btn && btn.addEventListener('click', async () =>{
    try{
      const email = (emailI.value||'').trim();
      if(!isValidEmail(email)){ msg.textContent = 'يرجى إدخال بريد إلكتروني صحيح.'; return; }
      // أرسل إلى خادمك عبر HTTPS:
      // await fetch('https://your-api.example.com/newsletter', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email})});
      msg.textContent = 'تم الاشتراك بنجاح! ✿';
    }catch(e){
      console.error(e);
      msg.textContent = 'عذراً، لم نتمكن من الاشتراك الآن.';
    }
  });
})();
</script>
</body>
</html>
